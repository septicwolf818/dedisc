<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="20%" stop-color="#FF9500"/>
      <stop offset="40%" stop-color="#FFCC00"/>
      <stop offset="60%" stop-color="#34C759"/>
      <stop offset="80%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#AF52DE"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <circle cx="128" cy="128" r="120" fill="#0B0B0C"/>

  <!-- disc -->
  <circle cx="128" cy="128" r="80" fill="#0A0A0A"/>
  <circle cx="128" cy="128" r="80" fill="none" stroke="#1F1F23" stroke-width="2"/>

  <!-- rainbow data track -->
  <circle cx="128" cy="128" r="70" fill="none" stroke="url(#rainbow)" stroke-width="6"/>
  <circle cx="128" cy="128" r="70" fill="none" stroke="#0A0A0A" stroke-width="2"/>

  <!-- inner track -->
  <circle cx="128" cy="128" r="52" fill="none" stroke="#2A2A30" stroke-width="1" opacity="0.6"/>

  <!-- center hub -->
  <circle cx="128" cy="128" r="20" fill="#FFFFFF"/>
  <circle cx="128" cy="128" r="20" fill="none" stroke="#000000" stroke-opacity="0.15" stroke-width="2"/>
  <circle cx="128" cy="128" r="6" fill="#0A0A0A"/>

  <!-- glow halo -->
  <circle cx="128" cy="128" r="88" fill="url(#glow)"/>
</svg>