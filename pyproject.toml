[build-system]
requires = ["meson-python>=0.20.0", "meson", "ninja"]
build-backend = "mesonpy"

[project]
name = "dedisc"
version = "0.1.0"
description = "An offline CD scanner and ripper for GNOME"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rafał Widło", email = "rafal.widlo@gmail.com" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: CD Audio :: CD Ripping",
]
dependencies = [
  "PyGObject>=3.46",
  "pycdio>=2.1.0",
  "discid>=1.4.0",
  "numpy>=1.26",
  "soundfile>=0.12",
  "mutagen>=1.45",
  "lameenc>=1.8",
]

[project.gui-scripts]
dedisc = "src.main:main"